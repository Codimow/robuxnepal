name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          timeout: 60s
          script: |
            # Navigate to the project directory
            cd /root/robuxnepal
            
            # Pull the latest changes
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Build the project
            npm run build
            
            # Restart the bot using systemd
            # Assumes the service name is 'robuxnepal'
            systemctl restart robuxnepal
